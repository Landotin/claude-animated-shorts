name: Reusable kit checks
on: [push, pull_request]
jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: python -m pip install -r kit/requirements.txt
      - run: python -m unittest discover -s kit/tests -v
      - run: python -m unittest discover -s kit/audio -p 'test*.py' -v
      - run: python kit/short.py init /tmp/cartoon-smoke --name Smoke --duration 17 --fps 24
      - run: npm ci
        working-directory: /tmp/cartoon-smoke
      - run: npm run typecheck && npm test
        working-directory: /tmp/cartoon-smoke
      - run: python /tmp/cartoon-smoke/.cartoon-kit/audio/mix.py /tmp/cartoon-smoke/project.json --out /tmp/cartoon-smoke/public/audio
      - run: python /tmp/cartoon-smoke/.cartoon-kit/short.py sync /tmp/cartoon-smoke/project.json
      - run: python /tmp/cartoon-smoke/.cartoon-kit/short.py check /tmp/cartoon-smoke/project.json
      - run: python kit/short.py init /tmp/genghis-smoke --example genghis --name GenghisKhanLife
      - run: ln -s /tmp/cartoon-smoke/node_modules /tmp/genghis-smoke/node_modules && npm run typecheck
        working-directory: /tmp/genghis-smoke
